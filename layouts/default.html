<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{site_title}}</title>
    <meta name="description" content="{{site_description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{site_title}}" />
    <meta property="og:description" content="{{site_description}}" />
    <meta property="og:url" content="{{base_url}}" />
    <meta property="og:image" content="{{base_url}}og.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#202020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 本文は等幅の M PLUS 1 Code、絵文字は白黒の Noto Emoji で感熱紙っぽく -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;600&family=Noto+Emoji&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="printer" aria-hidden="true"></div>

    <!-- レシート。中身(About / Links / Social)は index.md -->
    <main class="paper" id="paper">
        <img class="logo" src="receipt-icon.png" width="32" height="32" alt="" />
        <h1><a href="./">{{site_title}}</a></h1>
        <p class="center">毎度おおきに</p>
        <hr />
        <p class="row"><span id="receipt-date"></span><span id="receipt-no"></span></p>
        <hr />

        <!-- @CONTENTS -->
        {{{contents}}}
        <!-- /@CONTENTS -->

        <hr />
        <p class="row"><span>点数</span><span id="receipt-count"></span></p>
        <p class="row"><span>お預り</span><span>¥0</span></p>
        <p class="row"><span>おつり</span><span>¥0</span></p>
        <hr />
        <img class="qr" src="qr.png" width="25" height="25" alt="quojama.com の QR コード" />
        <p class="center">quojama.com</p>
        <p class="center thanks">またお越しください</p>
    </main>

    <button class="reprint" id="reprint" type="button">もう一枚印刷する</button>

    <!-- FOOTER（sankoku / pistachio-on-vss と同じ構成） -->
    <footer>
        Acknowledgments: <a href="https://github.com/veltiosoft/vss" target="_blank" rel="noopener noreferrer">VSS</a>,
        <a href="https://fonts.google.com/specimen/M+PLUS+1+Code" target="_blank" rel="noopener noreferrer">M PLUS 1 Code</a>,
        <a href="https://fonts.google.com/noto/specimen/Noto+Emoji" target="_blank" rel="noopener noreferrer">Noto Emoji</a><br />
        GitHub repository: <a href="https://github.com/quojama/quojama.com" target="_blank" rel="noopener noreferrer">quojama.com</a><br />
        Hosted by: <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a><br />
        &copy; <span id="copyright-year"></span> quojama
    </footer>

    <script>
        (function () {
            var paper = document.getElementById("paper");
            var count = 0;
            var timer = 0;

            document.getElementById("copyright-year").textContent = new Date().getFullYear();
            document.getElementById("receipt-count").textContent = paper.querySelectorAll("li a").length + "点";

            // レシートの1行ずつ(リストは項目ごと)
            var lines = [];
            Array.prototype.forEach.call(paper.children, function (el) {
                if (el.tagName === "UL") lines.push.apply(lines, el.children);
                else lines.push(el);
            });

            function stamp() {
                var d = new Date();
                var p = function (n) { return String(n).padStart(2, "0"); };
                count++;
                document.getElementById("receipt-date").textContent =
                    d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
                    "(" + "日月火水木金土"[d.getDay()] + ") " + p(d.getHours()) + ":" + p(d.getMinutes());
                document.getElementById("receipt-no").textContent = "No." + String(count).padStart(4, "0");
            }

            // 1行ずつ印字する。動きを減らす設定のときは一度に全部出す
            function print() {
                stamp();
                clearInterval(timer);
                if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
                lines.forEach(function (el) { el.classList.add("unprinted"); });
                var i = 0;
                timer = setInterval(function () {
                    lines[i++].classList.remove("unprinted");
                    if (i >= lines.length) clearInterval(timer);
                }, 70);
            }

            document.getElementById("reprint").addEventListener("click", print);
            print();
        })();
    </script>
</body>

</html>
