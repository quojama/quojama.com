<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{site_title}}</title>
    <meta name="description" content="{{site_description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{site_title}}" />
    <meta property="og:description" content="{{site_description}}" />
    <meta property="og:url" content="{{base_url}}" />
    <meta name="theme-color" content="#202020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>
        <header>
            <h1><a href="/">quojama</a></h1>
        </header>

        <!-- @CONTENTS -->
        {{{contents}}}
        <!-- /@CONTENTS -->

        <!-- FOOTER（sankoku / pistachio-on-vss と同じ構成） -->
        <footer>
            Acknowledgments: <a href="https://github.com/veltiosoft/vss" target="_blank" rel="noopener noreferrer">VSS</a>,
            <a href="https://codepen.io/pbitos/pen/zypwVr" target="_blank" rel="noopener noreferrer">VHS Retro</a>,
            <a href="https://fonts.google.com/specimen/Klee+One" target="_blank" rel="noopener noreferrer">Klee One</a><br />
            GitHub repository: <a href="https://github.com/quojama/quojama.com" target="_blank" rel="noopener noreferrer">quojama.com</a><br />
            Hosted by: <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a><br />
            &copy; <span id="copyright-year"></span> quojama
            <script>document.getElementById("copyright-year").textContent = new Date().getFullYear();</script>
        </footer>
    </main>
    <!-- ===== フォント比較（一時的。フォントが決まったらこのブロックごと削除） ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=M+PLUS+1+Code&family=DotGothic16&family=Stick&family=Dela+Gothic+One&family=RocknRoll+One&family=Reggae+One&family=Yusei+Magic&family=Zen+Kurenaido&family=Kaisei+Decol&family=Murecho&display=swap" rel="stylesheet" />
    <div class="font-picker">
        <label for="font-picker">font</label>
        <select id="font-picker"></select>
    </div>
    <style>
        .font-picker {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 10;
            padding: 6px 8px;
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--muted);
            font: 12px/1.4 sans-serif;
            animation: none;
            text-shadow: none;
        }
        .font-picker select {
            margin-left: 4px;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--line);
            font: inherit;
        }
    </style>
    <script>
        (function () {
            var fonts = ["Zen Maru Gothic", "M PLUS 1 Code", "DotGothic16", "Stick", "Dela Gothic One", "RocknRoll One",
                "Reggae One", "Yusei Magic", "Klee One", "Zen Kurenaido", "Kaisei Decol", "Murecho"];
            var fallback = getComputedStyle(document.body).fontFamily.replace(/^"Klee One",\s*/, "");
            var select = document.getElementById("font-picker");
            fonts.forEach(function (f, i) {
                var o = document.createElement("option");
                o.value = f;
                o.textContent = (i + 1) + ". " + f;
                select.appendChild(o);
            });
            function apply(f) {
                var family = '"' + f + '", ' + fallback;
                document.body.style.fontFamily = family;
                select.value = f;
            }
            var saved = null;
            try { saved = localStorage.getItem("font-picker"); } catch (e) {}
            apply(fonts.indexOf(saved) > -1 ? saved : "Klee One");
            select.addEventListener("change", function () {
                apply(select.value);
                try { localStorage.setItem("font-picker", select.value); } catch (e) {}
            });
        })();
    </script>
    <!-- ===== /フォント比較 ===== -->
</body>

</html>
